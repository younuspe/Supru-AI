<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>Supru AI</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="Supru%20AI%20ico.png" />
<link rel="apple-touch-icon" href="Supru%20AI%20ico.png" />
<meta name="theme-color" content="#050504" />
<style>
#supru-welcome{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 46%,#14120d 0%,#070706 34%,#020202 76%);color:#f1eadc;transition:opacity 900ms ease,background 900ms ease}
#supru-welcome.is-connected{background:linear-gradient(135deg,#f7f3ea,#fffdf8 52%,#eee6d8);color:#211f1b}
html[data-supru-state="connected"] #supru-welcome{opacity:0;pointer-events:none}
.supru-welcome-inner{position:relative;z-index:1;width:min(92vw,760px);min-height:min(82vh,720px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.supru-hero{width:clamp(190px,30vw,300px);height:clamp(190px,30vw,300px);object-fit:cover;border-radius:50%;background:#f0a51a;box-shadow:0 0 0 1px rgba(240,165,26,.25),0 18px 70px rgba(240,165,26,.16)}
.supru-welcome-title{margin:0;font:600 clamp(28px,5vw,46px)/1.1 system-ui,-apple-system,sans-serif;letter-spacing:.04em}.supru-welcome-title strong{color:#f0a51a}.supru-welcome-subtitle{margin:-8px 0 14px;color:#a99f8d;font:400 clamp(14px,2vw,17px)/1.5 system-ui,-apple-system,sans-serif;max-width:min(90vw,620px)}
.supru-action{min-width:190px;min-height:50px;padding:12px 28px;border:1px solid rgba(226,166,62,.38);border-radius:999px;background:#e2a63e;color:#171006;cursor:pointer;font:600 14px/1 system-ui,-apple-system,sans-serif;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 8px 30px rgba(0,0,0,.28)}
.supru-action:disabled{opacity:.6;cursor:wait}#supru-welcome.is-connected .supru-action{background:#c77b22;border-color:#c77b22;color:#fffdf8}
@media(max-width:560px){.supru-action{width:min(82vw,340px)}}
@media(prefers-reduced-motion:reduce){.supru-hero{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="supru-welcome" data-state="waiting" aria-label="Supru AI welcome screen"><div class="supru-welcome-inner"><img class="supru-hero" src="/Supru%20AI%20WEb.png" alt="Supru" /><h1 class="supru-welcome-title"><strong>Supru</strong> AI</h1><p id="supru-status" class="supru-welcome-subtitle">Supru is waiting… curious.</p><button id="supru-connect" class="supru-action" type="button">Meow!</button></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
