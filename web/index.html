<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supru-AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; padding: 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #58a6ff; margin-bottom: 30px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0d1117; }
        .header { height: 60px; border-bottom: 1px solid #30363d; display: flex; align-items: center; padding: 0 30px; background: #161b22; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🤖 Supru-AI</div>
    </div>
    <div class="main-content">
        <div class="header"><h2>Workspace: Supru-Core</h2></div>
    </div>
</body>
</html>
