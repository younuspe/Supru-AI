<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supru AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #07090e; color: #e1e7f0; display: flex; height: 100vh; overflow: hidden; }

        /* Left Side Navigation Sidebar panel matching your images */
        .sidebar { width: 290px; background: rgba(17, 22, 32, 0.85); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; padding: 24px; justify-content: space-between; z-index: 10; }
        .sidebar-top { display: flex; flex-direction: column; gap: 24px; }
        
        /* Top Left Header Area Match */
        .brand-header-row { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .brand-text-block { display: flex; flex-direction: column; }
        .brand-title { font-size: 26px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 12px; color: #ffffff; font-weight: 600; margin-top: 1px; }
        
        .status-container { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 4px; }
        .status-text { font-size: 12px; color: #4ade80; font-weight: 500; letter-spacing: 0.2px; }
        .status-dot { width: 10px; height: 10px; background-color: #4ade80; border-radius: 50%; box-shadow: 0 0 12px #4ade80; }
        
        /* Middle Session controls row */
        .session-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .new-session-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 12px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; color: #cbd5e1; transition: 0.2s; }
        .new-session-btn:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.2); }
        .session-hint { font-size: 12px; color: #4e5d73; text-align: center; margin-top: 2px; }

        /* Bottom Left Profile Card Area Match */
        .profile-card { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; position: relative; }
        .avatar-box { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); background: #000; flex-shrink: 0; }
        .profile-details { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .user-name-title { font-size: 18px; color: #ffffff; font-weight: 500; letter-spacing: -0.2px; }
        .profile-actions { display: flex; align-items: center; gap: 10px; }
        
        /* Interactive Gear Icon SVG Configuration */
        .gear-btn { width: 20px; height: 20px; color: #a0aec0; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .gear-btn:hover { color: #ffffff; transform: rotate(30deg); }
        .gear-btn svg { width: 100%; height: 100%; fill: currentColor; }
        
        .connect-badge-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 4px 12px; color: #ffffff; font-size: 12px; cursor: pointer; font-weight: 500; transition: 0.2s; }
        .connect-badge-btn:hover { background: rgba(255, 255, 255, 0.05); border-color: #ffffff; }

        /* Main Center Workspace Frame */
        .workspace-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
        .immersive-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.22; pointer-events: none; mix-blend-mode: lighten; }

        /* Top Right Utilities Row Navigation */
        .top-navigation { height: 64px; display: flex; align-items: center; justify-content: flex-end; padding: 0 30px; gap: 20px; z-index: 5; }
        .top-nav-link { font-size: 13px; color: #a0aec0; cursor: pointer; transition: 0.15s; }
        .top-nav-link:hover { color: #ffffff; }
        .search-field { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; padding: 6px 12px; color: #ffffff; font-size: 12px; outline: none; width: 160px; }

        /* Display Screens view toggle frames */
        .screen-view { flex: 1; display: none; padding: 30px; z-index: 5; position: relative; flex-direction: column; }
        .screen-view.active { display: flex; }
        .message-log-stream { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 25px; }
        .chat-bubble { max-width: 70%; padding: 14px 18px; border-radius: 14px; font-size: 15px; line-height: 1.5; background: rgba(22, 28, 38, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); }

        /* Engine Setup Form card elements */
        .settings-card-block { max-width: 540px; background: rgba(20, 26, 38, 0.9); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 24px; margin-top: 20px; }
        .settings-card-block h3 { color: #ffffff; margin-bottom: 12px; font-size: 16px; }
        .settings-input-wrapper { display: flex; gap: 10px; margin-top: 14px; }
        .api-input-box { flex: 1; padding: 12px; background: #07090e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 6px; color: white; outline: none; font-size: 14px; }
        .api-input-box:focus { border-color: #cbd5e1; }
        .save-token-btn { background: #ffffff; color: #07090e; border: none; border-radius: 6px; padding: 12px 20px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .save-token-btn:hover { background: #cbd5e1; }

        /* UPGRADED CHAT BOX CONSOLE INPUT COMPONENT WITH NESTED BUTTONS */
        .bottom-console-wrapper { max-width: 840px; width: 100%; margin: 0 auto 30px auto; z-index: 5; padding: 0 20px; }
        .console-pill-box { background: rgba(20, 26, 38, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
        
        /* Left side + icon button */
        .plus-attach-btn { color: #718096; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; background: transparent; border: none; }
        .plus-attach-btn:hover { color: #ffffff; }
        .plus-attach-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .console-pill-box input { flex: 1; background: transparent; border: none; color: #ffffff; font-size: 15px; outline: none; }
        .console-pill-box input::placeholder { color: #4e5d73; }
        
        /* Right side clean Send button */
        .send-submit-btn { color: #718096; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; background: transparent; border: none; }
        .send-submit-btn:hover { color: #ffffff; }
        .send-submit-btn svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- Left Hand Sidebar Configuration Panel -->
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="brand-header-row">
                <div class="brand-text-block">
                    <span class="brand-title">Supru AI</span>
                    <span class="brand-subtitle">Power of Meow!</span>
                </div>
                <div class="status-container">
                    <span class="status-text">Connected</span>
                    <span class="status-dot"></span>
                </div>
            </div>
            
            <div class="session-container">
                <div class="new-session-btn" onclick="toggleView('chat')">+ New Session</div>
                <div class="session-hint">Create a sesson to get started</div>
            </div>
        </div>

        <!-- Left bottom Profile Node Matching Your Zoomed Screenshot Exactly -->
        <div class="profile-card">
            <div class="avatar-box">
                <!-- Displays your real cat portrait cleanly inside the card box frame -->
                <img src="https://unsplash.com" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div class="profile-details">
                <h4 class="user-name-title">User name</h4>
                <div class="profile-actions">
                    <!-- FUNCTIONAL METALLIC GEAR SYMBOL ICON REPLACES THE placeholder text -->
                    <button class="gear-btn" onclick="toggleView('engine')" title="Engine Settings">

                        </svg>
                    </button>
                    <button class="connect-badge-btn" onclick="alert('Local system connection online.')">Connect</button>
                </div>
            </div>
        </div>
    </div>
