<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supru AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { 
            background-color: #08070f; 
            color: #ffffff; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden;
            display: flex; /* Forces side-by-side columns */
        }

        /* Left Side Sidebar Panel */
        .sidebar-panel {
            width: 320px; /* Locked size so it stops blocking your chat area */
            height: 100vh;
            background-color: #10101c;
            border-right: 1px solid #3a4057;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0; /* Prevents sidebar from shrinking */
        }

        /* Main Workspace Right Side Area */
        .main-workspace {
            flex: 1; /* Automatically takes up the remaining screen space */
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Brand Block Metrics */
        .brand-block {
            padding-bottom: 20px;
        }
        .supru-title {
            font-size: 36px;
            font-weight: 800;
            color: #b5b5eb;
            line-height: 1.1;
        }
        .brand-subtitle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
            gap: 8px;
        }
        .supru-caption {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-connected {
            font-size: 14px;
            font-weight: 500;
            color: #1a9136;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #7ad697;
            border-radius: 50%;
            box-shadow: 0 0 8px #7ad697;
        }

        /* Middle Session Controls Layer */
        .session-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .new-session-box {
            width: 100%;
            height: 48px;
            background-color: #10101c;
            border-radius: 6px;
            border: 1px solid #363c59;
            color: #b5b5eb;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .new-session-box:hover {
            background-color: rgba(255,255,255,0.02);
            border-color: #cbd5e1;
        }
        .session-hint-text {
            font-size: 14px;
            color: #b5b5eb;
            text-align: center;
        }

        /* User Footer Profile Block Match */
        .profile-border-outer {
            width: 100%;
            height: 130px;
            background-color: transparent;
            border-radius: 10px;
            border: 2px solid #3f4457;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }
        .avatar-shadow-blur {
            position: absolute;
            left: 12px;
            top: -20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #595b6b;
            filter: blur(30px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }
        .avatar-image-frame {
            width: 80px;
            height: 90px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-meta-actions {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }
        .user-name-title {
            font-size: 20px;
            color: #ffffff;
            font-weight: 500;
        }
        .profile-btn-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gear-settings-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gear-settings-icon svg {
            width: 26px;
            height: 26px;
            fill: #666b8a;
        }
        .connect-action-block {
            flex: 1;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Top Utilities Navbar */
        .top-navigation {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 30px;
            gap: 24px;
            z-index: 5;
        }
        .top-nav-link {
            font-size: 16px;
            font-weight: 300;
            color: #ffffff;
            cursor: pointer;
            background: transparent;
            border: none;
        }
        .search-container {
            width: 240px;
            height: 33px;
            background-color: #10101c;
            border: 1px solid #303447;
            border-radius: 4px;
            padding: 0 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 300;
            outline: none;
        }

        /* View Panels Toggle Configurations */
        .screen-view-panel {
            flex: 1;
            display: none;
            padding: 40px;
            overflow-y: auto;
            position: relative;
            z-index: 5;
        }
        .screen-view-panel.active {
            display: flex;
            flex-direction: column;
        }

        .chat-output-logger {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            margin-bottom: 20px;
            width: 100%;
        }
        .chat-bubble {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.5;
            background-color: #10101c;
            border: 1px solid #3a4057;
        }

        .gateway-card-block {
            max-width: 440px;
            width: 100%;
            background-color: #10101c;
            border: 1px solid #3a4057;
            border-radius: 12px;
            padding: 32px;
            margin: auto;
            text-align: center;
        }
        .form-input-row {
            width: 100%;
            padding: 14px;
            background-color: #08070f;
            border: 1px solid #363c59;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .center-mascot-backdrop {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 700px;
            opacity: 0.15;
            pointer-events: none;
            mix-blend-mode: lighten;
            z-index: 1;
        }

        /* Bottom Entry Prompting Ribbon Strip Component */
        .bottom-console-wrapper {
            width: 100%;
            height: 80px;
            background-color: #10101c;
            border-radius: 10px;
            border: 1px solid #3a4057;
            display: flex;
            align-items: center;
            padding: 0 24px;
            margin-top: auto;
            z-index: 5;
        }
        .plus-utilities-trigger {
            font-size: 40px;
            color: #ffffff;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            line-height: 1;
        }
        .console-input-element {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 18px;
            padding: 0 20px;
        }
        .send-submit-action {
            height: 38px;
            width: 80px;
            border-radius: 6px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Left Side Control Column Sidebar Panel Component -->
    <div class="sidebar-panel">
        <div>
            <div class="brand-block">
                <div class="supru-title">Supru AI</div>
                <div class="brand-subtitle-row">
                    <span class="supru-caption">Power of Meow!</span>
                    <div class="status-container">
                        <span class="status-connected">Connected</span>
                        <span class="status-dot"></span>
                    </div>
                </div>
            </div>
            
            <div class="session-container">
