<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supru AI Dashboard</title>
    <style>
        /* Exact layout style and color variables from your pen.dev canvas */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        
        body { 
            background-color: #08070f; 
            color: #ffffff; 
            width: 1920px; 
            height: 1080px; 
            position: relative; 
            overflow: hidden;
        }

        /* Top Left Header Coordinates */
        .supru-title {
            position: absolute;
            left: 20px;
            top: 28px;
            width: 352px;
            height: 76px;
            font-size: 50px;
            font-weight: 800;
            color: #b5b5eb;
            display: flex;
            align-items: center;
        }

        .supru-caption {
            position: absolute;
            left: 106px;
            top: 86px;
            width: 146px;
            height: 13px;
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }

        .status-connected {
            position: absolute;
            left: 315px;
            top: 45px;
            width: 113px;
            height: 28px;
            font-size: 19px;
            font-weight: 500;
            color: #1a9136;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-dot {
            position: absolute;
            left: 403px;
            top: 77px;
            width: 18px;
            height: 18px;
            background-color: #7ad697;
            border-radius: 50%;
        }

        /* Top Right Utilities Row Navigation */
        .nav-menu {
            position: absolute;
            left: 1439px;
            top: 40px;
            width: 53px;
            font-size: 17px;
            font-weight: 300;
            text-align: center;
            color: #ffffff;
        }

        .nav-help {
            position: absolute;
            left: 1492px;
            top: 40px;
            width: 53px;
            font-size: 17px;
            font-weight: 300;
            text-align: center;
            color: #ffffff;
        }

        /* Search Box Frame 5 Component Layout */
        .search-container {
            position: absolute;
            left: 1572px;
            top: 32px;
            width: 311px;
            height: 33px;
            background-color: #10101c;
            border: 1px solid #303447;
            display: flex;
            align-items: center;
            padding: 0 14px;
        }

        .search-placeholder-text {
            position: absolute;
            left: 1586px;
            top: 39px;
            width: 72px;
            font-size: 17px;
            font-weight: 300;
            text-align: center;
            color: #ffffff;
            pointer-events: none;
        }

        /* Left Sidebar: Frame 1 Element Mapping */
        .sidebar-panel {
            position: absolute;
            left: 23px;
            top: 109px;
            width: 428px;
            height: 934px;
            background-color: #10101c;
            border-radius: 10px;
            border: 1px solid #3a4057;
        }

        /* New Session Button Box: Frame 4 Node Layout */
        .new-session-box {
            position: absolute;
            left: 16px;
            top: 18px;
            width: 393px;
            height: 56px;
            background-color: #10101c;
            border-radius: 6px;
            border: 1px solid #363c59;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .new-session-text {
            font-size: 17px;
            font-weight: 600;
            color: #b5b5eb;
        }

        .session-hint-text {
            position: absolute;
            left: 69px;
            top: 90px;
            width: 289px;
            height: 32px;
            font-size: 17px;
            color: #b5b5eb;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* User Footer Component Area Layout */
        .profile-border-outer {
            position: absolute;
            left: 12px;
            top: 769px;
            width: 397px;
            height: 154px;
            background-color: transparent;
            border-radius: 10px;
            border: 2px solid #3f4457;
            pointer-events: none;
        }

        /* Shadow Aura Blur Glow Box Behind Cat Profile Portrait */
        .avatar-shadow-blur {
            position: absolute;
            left: 42px;
            top: 717px;
            width: 171px;
            height: 170px;
            border-radius: 506px;
            background-color: #595b6b;
            filter: blur(66.9px);
            opacity: 0.8;
            pointer-events: none;
        }

        /* Cat Profile Portrait Frame Component */
        .avatar-image-frame {
            position: absolute;
            left: 12px;
            top: 717px;
            width: 178px;
            height: 183px;
            overflow: hidden;
        }

        .avatar-image-frame img {
            position: absolute;
            left: -16px;
            top: 19px;
            width: 194px;
            height: 217px;
            object-fit: cover;
        }

        .user-name-title {
            position: absolute;
            left: 227px;
            top: 775px;
            width: 182px;
            height: 53px;
            font-size: 30px;
            color: #ffffff;
        }

        /* Mechanical Gear Icon Placeholder */
        .gear-settings-icon {
            position: absolute;
            left: 214px;
            top: 859px;
            width: 57px;
            height: 51px;
            background-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gear-settings-icon svg {
            width: 32px;
            height: 32px;
            fill: #666b8a;
        }

        /* Connect Button Container Block */
        .connect-action-block {
            position: absolute;
            left: 299px;
            top: 863px;
            width: 101px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMMERSIVE CENTER MASCOT BACKGROUND PHOTO LAYER WITH 25% OPACITY */
        .center-mascot-backdrop {
            position: absolute;
            left: 529px;
            top: 102px;
            width: 1084.5px;
            height: 792px;
            opacity: 0.25;
            object-fit: cover;
            pointer-events: none;
            mix-blend-mode: lighten;
        }

        /* Console Input Field: Bottom Strip Container Area mapping */
        .bottom-console-wrapper {
            position: absolute;
            left: 473px;
            top: 919px;
            width: 1361px;
            height: 102px;
            background-color: #10101c;
            border-radius: 10px;
            border: 1px solid #3a4057;
            display: flex;
            align-items: center;
            padding: 0 36px;
        }

        .plus-utilities-trigger {
            font-size: 57px;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            margin-top: -10px;
        }

        .console-input-element {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 21px;
            padding-left: 50px;
            padding-right: 140px;
        }

        .console-input-element::placeholder {
            color: #ffffff;
            opacity: 1;
        }

        /* Standalone Send Action Button Match */
        .send-submit-action {
            position: absolute;
            left: 1227px;
            top: 27px;
            width: 101px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Top Left Brand Identifiers -->
    <div class="supru-title">Supru AI</div>
    <div class="supru-caption">Power of Meow!</div>
    <div class="status-connected">Connected</div>
    <div class="status-dot"></div>

    <!-- Top Right Row Utilities Navigation Links -->
    <div class="nav-menu">Menu</div>
    <div class="nav-help">Help</div>
    <div class="search-container"></div>
    <div class="search-placeholder-text">Search</div>

    <!-- Left Side Control Column Sidebar Panel -->
    <div class="sidebar-panel">
        <div class="new-session-box">
            <span class="new-session-text">+ New Session</span>
        </div>
        <div class="session-hint-text">Create a sesson to get started</div>
        
        
        <div class="avatar-shadow-blur"></div>
        <div class="avatar-image-frame">
            <!-- Uses your local directory source images from your file profile configurations -->
