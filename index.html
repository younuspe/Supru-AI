<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supru AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #07060d;
            color: #f4f2f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #07060d;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 90px;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            padding: 23px 25px 0 14px;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-name {
            color: #aaa6e8;
            font-size: 45px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .brand-tagline {
            margin-left: 72px;
            margin-top: 3px;
            font-size: 15px;
            font-weight: 700;
            color: #f2f0f5;
        }

        .connection {
            position: absolute;
            left: 272px;
            top: 38px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .connected {
            color: #13a94c;
            font-size: 16px;
        }

        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #78d99d;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 1px;
        }

        .menu,
        .help {
            color: #dedce3;
            font-size: 15px;
            padding: 8px 3px;
        }

        .search {
            width: 269px;
            height: 29px;

            margin-left: 15px;

            border: 1px solid #29283b;
            background: #0e0d17;

            color: white;
            padding: 0 18px;

            font-size: 14px;
            outline: none;
        }

        .search::placeholder {
            color: #d0cdd5;
        }

        /* =========================
           LEFT SIDEBAR
        ========================= */

        .sidebar {
            position: absolute;
            left: 15px;
            top: 90px;
            bottom: 32px;

            width: 370px;

            border: 1px solid #34334b;
            border-radius: 10px;

            background: #10101b;

            padding: 15px 13px 10px;

            z-index: 5;
        }

        .new-session {
            width: 100%;
            height: 49px;

            border: 1px solid #393952;
            border-radius: 5px;

            background: #11111e;
            color: #b5b1e7;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .new-session:hover {
            background: #171627;
        }

        .empty-message {
            margin-top: 19px;

            text-align: center;

            color: #aaa8d1;
            font-size: 15px;
        }

        /* =========================
           USER CARD
        ========================= */

        .user-card {
            position: absolute;
            left: 10px;
            right: 15px;
            bottom: 7px;

            height: 134px;

            border: 2px solid #3b3b55;
            border-radius: 8px;

            background: #11111d;

            overflow: hidden;
        }

        .cat-small {
            position: absolute;
            left: -8px;
            bottom: -7px;

            width: 170px;
            height: 155px;

            object-fit: contain;

            filter:
                drop-shadow(0 0 12px rgba(150, 150, 255, 0.30));
        }

        .user-name {
            position: absolute;
            top: 7px;
            left: 184px;

            font-size: 27px;
            color: #f1eff4;
            white-space: nowrap;
        }

        .settings {
            position: absolute;
            left: 178px;
            bottom: 12px;

            width: 44px;
            height: 44px;

            border: none;
            background: transparent;

            font-size: 39px;
            line-height: 1;

            cursor: pointer;
        }

        .connect-button {
            position: absolute;
            right: 6px;
            bottom: 12px;

            height: 39px;
            width: 88px;

            border: 1px solid #565675;
            border-radius: 7px;

            background: #12121f;
            color: #eeeeef;

            font-size: 14px;

            cursor: pointer;
        }

        .connect-button:hover {
            background: #1a192a;
        }

        /* =========================
           MAIN CAT AREA
        ========================= */

        .main-area {
            position: absolute;

            left: 385px;
            right: 0;
            top: 0;
            bottom: 0;

            overflow: hidden;
        }

        .cat-background {
            position: absolute;

            left: 4%;
            top: 25px;

            width: 72%;
            height: 78%;

            object-fit: contain;

            opacity: 0.23;

            filter:
                brightness(0.55)
                contrast(1.15);

            pointer-events: none;
        }

        /* =========================
           MESSAGE BOX
        ========================= */

        .message-area {
            position: absolute;

            left: 18px;
            right: 67px;
            bottom: 50px;

            height: 88px;

            border: 1px solid #393951;
            border-radius: 9px;

            background: #10101b;

            display: flex;
            align-items: center;

            padding: 0 27px;

            z-index: 6;
        }

        .plus {
            font-size: 43px;
            font-weight: 300;

            width: 62px;

            color: #ffffff;
        }

        .message-text {
            flex: 1;

            color: #eeecf2;
            font-size: 18px;
        }

        .send-button {
            width: 87px;
            height: 40px;

            border: 1px solid #575774;
            border-radius: 7px;

            background: #12121f;
            color: #efedf2;

            font-size: 14px;

            cursor: pointer;
        }

        .send-button:hover {
            background: #1a192a;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 300px;
            }

            .main-area {
                left: 315px;
            }

            .connection {
                display: none;
            }

            .search {
                width: 180px;
            }

            .brand-name {
                font-size: 36px;
            }

            .brand-tagline {
                margin-left: 55px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="top-bar">

        <div class="brand">
            <div class="brand-name">Supru AI</div>
            <div class="brand-tagline">Power of Meow!</div>
        </div>

        <div class="connection">
            <div class="connected">Connected</div>
            <div class="status-dot"></div>
        </div>

        <div class="top-right">
            <div class="menu">Menu</div>
            <div class="help">Help</div>

            <input
                class="search"
                type="text"
                placeholder="Search"
            >
        </div>

    </header>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <button class="new-session">
            + New Session
        </button>

        <div class="empty-message">
            Create a session to get started
        </div>


        <!-- USER CARD -->

        <div class="user-card">

            <!--
                Put your Supru image here.
                Example:
                images/supru.png
            -->

            <img
                class="cat-small"
                src="images/supru.png"
                alt="Supru"
            >

            <div class="user-name">
                User name
            </div>

            <button class="settings" title="Settings">
                ⚙
            </button>

            <button class="connect-button">
                Connect
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN AREA
    ========================= -->

    <main class="main-area">

        <!-- Large Supru background image -->

        <img
            class="cat-background"
            src="images/supru.png"
            alt="Supru"
        >


        <!-- =========================
             MESSAGE BAR
        ========================= -->

        <div class="message-area">

            <div class="plus">
                +
            </div>

            <div class="message-text">
                Supru is ready to hear from you.
            </div>

            <button class="send-button">
                Send
            </button>

        </div>

    </main>

</div>


<script>

    /* New Session */

    document
        .querySelector(".new-session")
        .addEventListener("click", function () {

            alert("New Supru session started.");

        });


    /* Connect */

    document
        .querySelector(".connect-button")
        .addEventListener("click", function () {

            const status = document.querySelector(".connected");

            status.textContent = "Connected";

        });


    /* Send */

    document
        .querySelector(".send-button")
        .addEventListener("click", function () {

            const message = document.querySelector(".message-text");

            message.textContent =
                "Supru received your message.";

        });


    /* Search */

    document
        .querySelector(".search")
        .addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                const value = this.value.trim();

                if (value !== "") {

                    console.log(
                        "Searching Supru AI for:",
                        value
                    );

                }

            }

        });

</script>

</body>
</html>
