<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supru AI Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #08070f; 
            color: #ffffff; 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            overflow: hidden;
            display: flex;
        }

        .sidebar-panel {
            width: 428px;
            height: 100vh;
            background-color: #10101c;
            border-right: 1px solid #3a4057;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .main-workspace {
            flex: 1;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .brand-block {
            padding-bottom: 20px;
        }
        .supru-title {
            font-size: 50px;
            font-weight: 800;
            color: #b5b5eb;
            line-height: 1.1;
        }
        .brand-subtitle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        .supru-caption {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-connected {
            font-size: 19px;
            font-weight: 500;
            color: #1a9136;
        }
        .status-dot {
            width: 14px;
            height: 14px;
            background-color: #7ad697;
            border-radius: 50%;
            box-shadow: 0 0 10px #7ad697;
        }

        .session-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .new-session-box {
            width: 100%;
            height: 56px;
            background-color: #10101c;
            border-radius: 6px;
            border: 1px solid #363c59;
            color: #b5b5eb;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        .session-hint-text {
            font-size: 17px;
            color: #b5b5eb;
            text-align: center;
        }

        .profile-border-outer {
            width: 100%;
            height: 154px;
            background-color: transparent;
            border-radius: 10px;
            border: 2px solid #3f4457;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
        }
        .avatar-shadow-blur {
            position: absolute;
            left: 12px;
            top: -30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #595b6b;
            filter: blur(40px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }
        .avatar-image-frame {
            width: 110px;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .avatar-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-meta-actions {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }
        .user-name-title {
            font-size: 24px;
            color: #ffffff;
            font-weight: 500;
        }
        .profile-btn-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gear-settings-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gear-settings-icon svg {
            width: 32px;
            height: 32px;
            fill: #666b8a;
        }
        .connect-action-block {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }

        .top-navigation {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 30px;
            gap: 24px;
            z-index: 5;
        }
        .top-nav-link {
            font-size: 17px;
            font-weight: 300;
            color: #ffffff;
            cursor: pointer;
            background: transparent;
            border: none;
        }
        .search-container {
            width: 311px;
            height: 33px;
            background-color: #10101c;
            border: 1px solid #303447;
            border-radius: 4px;
            padding: 0 12px;
            color: #ffffff;
            font-size: 17px;
            font-weight: 300;
            outline: none;
        }

        .screen-view-panel {
            flex: 1;
            display: none;
            padding: 40px;
            overflow-y: auto;
            position: relative;
            z-index: 5;
        }
        .screen-view-panel.active {
            display: flex;
            flex-direction: column;
        }

        .chat-output-logger {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            margin-bottom: 20px;
            max-width: 1000px;
            width: 100%;
        }
        .chat-bubble {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.5;
            background-color: #10101c;
            border: 1px solid #3a4057;
        }

        .gateway-card-block {
            max-width: 440px;
            width: 100%;
            background-color: #10101c;
            border: 1px solid #3a4057;
            border-radius: 12px;
            padding: 32px;
            margin: auto;
            text-align: center;
        }
        .form-input-row {
            width: 100%;
            padding: 14px;
            background-color: #08070f;
            border: 1px solid #363c59;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .center-mascot-backdrop {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 900px;
            opacity: 0.15;
            pointer-events: none;
            mix-blend-mode: lighten;
            z-index: 1;
        }

        .bottom-console-wrapper {
            width: 100%;
            max-width: 1000px;
            height: 102px;
            background-color: #10101c;
            border-radius: 10px;
            border: 1px solid #3a4057;
            display: flex;
            align-items: center;
            padding: 0 36px;
            margin: auto auto 0 auto;
            z-index: 5;
            position: relative;
        }
        .plus-utilities-trigger {
            font-size: 57px;
            color: #ffffff;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            margin-top: -10px;
        }
        .console-input-element {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 21px;
            padding: 0 30px;
        }
        .send-submit-action {
            height: 44px;
            width: 101px;
            border-radius: 8px;
            border: 1px solid #666b8a;
            background-color: transparent;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="sidebar-panel">
        <div>
            <div class="brand-block">
                <div class="supru-title">Supru AI</div>
                <div class="brand-subtitle-row">
                    <span class="supru-caption">Power of Meow!</span>
                    <div class="status-container">
                        <span class="status-connected">Connected</span>
                        <span class="status-dot"></span>
                    </div>
                </div>
            </div>
            
            <div class="session-container">
                <button class="new-session-box" onclick="togglePlatformPage('chat-view')">+ New Session</button>
                <div class="session-hint-text" style="margin-top: 12px;">Create a sesson to get started</div>
            </div>
        </div>
        
        <div class="profile-border-outer">
            <div class="avatar-shadow-blur"></div>
            <div class="avatar-image-frame">
                <img src="../bridge/src/assets/logo.png" onerror="this.src='https://unsplash.com'" alt="Supru Icon">
            </div>
            <div class="profile-meta-actions">
                <h4 class="user-name-title">User name</h4>
                <div class="profile-btn-row">
