name: Build Supru-AI macOS ARM64

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supru-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Supru-AI macOS ARM64
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install OMP runtime for bundled Bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/src/bin
          npm view @oh-my-pi/pi-coding-agent version
          npm pack @oh-my-pi/pi-coding-agent --pack-destination /tmp
          OMP_TGZ="$(find /tmp -maxdepth 1 -type f -name 'pi-coding-agent-*.tgz' -print -quit)"
          test -n "$OMP_TGZ"
          mkdir -p /tmp/omp-package
          tar -xzf "$OMP_TGZ" -C /tmp/omp-package
          OMP_BIN="$(find /tmp/omp-package -type f -name 'omp' -perm -111 -print -quit)"
          if [ -z "$OMP_BIN" ]; then
            echo "No executable named omp was found in the OMP package."
            find /tmp/omp-package -maxdepth 6 -type f | head -100
            exit 1
          fi
          cp "$OMP_BIN" bridge/src/bin/omp
          chmod 755 bridge/src/bin/omp
          file bridge/src/bin/omp

      - name: Run desktop tests
        run: npm run test:desktop
        working-directory: web

      - name: Run platform regression tests
        run: npm run test:platform
        working-directory: web

      - name: Run bridge tests
        run: npm test
        working-directory: bridge

      - name: Build and package macOS ARM64
        run: npm run package:mac -- --arm64
        working-directory: web

      - name: Verify packaged macOS ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.dmg' -print -quit)"
          ZIP="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.zip' -print -quit)"
          test -n "$DMG"
          test -n "$ZIP"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_POINT" -quiet
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle was found inside the generated DMG."
            exit 1
          fi

          BUNDLED_OMP="$APP/Contents/Resources/bridge/src/bin/omp"
          test -f "$BUNDLED_OMP"
          test -x "$BUNDLED_OMP"
          file "$BUNDLED_OMP"

          echo "Checking the signature produced by electron-builder..."
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 || true
          spctl --assess --type execute --verbose=4 "$APP" || true

          echo "Verified Supru-AI macOS ARM64 artifacts and bundled OMP runtime:"
          find release -maxdepth 1 -type f \( -name '*-mac-arm64-adhoc.dmg' -o -name '*-mac-arm64-adhoc.zip' \) -print
        working-directory: web

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supru-AI-macOS-arm64-${{ github.sha }}
          path: |
            web/release/*-mac-arm64-adhoc.dmg
            web/release/*-mac-arm64-adhoc.zip
          if-no-files-found: error
          retention-days: 14
