name: Build Supru-AI macOS ARM64

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'web/**'
      - '.github/workflows/desktop-apps.yml'

permissions:
  contents: read

concurrency:
  group: supru-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Supru-AI macOS ARM64
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Setup Bun for OMP compatibility checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned OMP for CI compatibility check
        run: npm install --global @oh-my-pi/pi-coding-agent@18.0.8

      - name: Verify OMP CLI
        run: |
          set -euo pipefail
          command -v bun
          command -v omp
          bun --version
          omp --version

      - name: Run desktop tests
        run: npm run test:desktop
        working-directory: web

      - name: Run platform regression tests
        run: npm run test:platform
        working-directory: web

      - name: Run bridge tests
        run: npm test 2>&1 | tee bridge-test.log
        working-directory: bridge

      - name: Print bridge test failures clearly
        if: failure()
        shell: bash
        run: |
          echo '========== BRIDGE TEST FAILURE REPORT =========='
          if [ -f bridge/bridge-test.log ]; then
            grep -E '^(not ok|FAIL|Error:|AssertionError|  (actual|expected):)' bridge/bridge-test.log || true
            tail -n 120 bridge/bridge-test.log
          fi
          echo '========== END BRIDGE TEST FAILURE REPORT =========='

      - name: Build desktop renderer
        run: npm run build:desktop-renderer
        working-directory: web

      - name: Verify renderer bundle
        run: npm run verify:desktop-renderer
        working-directory: web

      - name: Build Electron main process
        run: npm run build:electron
        working-directory: web

      - name: Package the EXACT verified build
        run: npx electron-builder --publish never --mac --arm64
        working-directory: web

      - name: Verify packaged macOS ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.dmg' -print -quit)"
          ZIP="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.zip' -print -quit)"
          test -n "$DMG"
          test -n "$ZIP"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_POINT" -quiet
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          APP_ASAR="$APP/Contents/Resources/app.asar"
          test -f "$APP_ASAR"
          echo "Checking packaged app.asar..."
          npx asar list "$APP_ASAR" > packaged-asar-list.txt
          grep -q '^dist/index.html$' packaged-asar-list.txt
          grep -q '^dist/assets/' packaged-asar-list.txt
          if grep -E '^dist/.*\.(ts|tsx)$' packaged-asar-list.txt; then
            echo 'ERROR: TypeScript source was packaged into the renderer dist tree.'
            exit 1
          fi

          echo "Checking the signature produced by electron-builder..."
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 || true
          spctl --assess --type execute --verbose=4 "$APP" || true

          echo "Verified Supru-AI macOS ARM64 artifacts."
          find release -maxdepth 1 -type f \( -name '*-mac-arm64-adhoc.dmg' -o -name '*-mac-arm64-adhoc.zip' \) -print
        working-directory: web

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supru-AI-macOS-arm64-${{ github.sha }}
          path: |
            web/release/*-mac-arm64-adhoc.dmg
            web/release/*-mac-arm64-adhoc.zip
          if-no-files-found: error
          retention-days: 14
