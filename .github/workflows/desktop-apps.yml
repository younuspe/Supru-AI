name: Build Supru-AI macOS ARM64

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'bridge/**'
      - '.github/workflows/desktop-apps.yml'

permissions:
  contents: read

concurrency:
  group: supru-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Supru-AI macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run desktop tests
        run: npm run test:desktop
        working-directory: web

      - name: Run platform regression tests
        run: npm run test:platform
        working-directory: web

      - name: Run bridge tests
        run: npm test
        working-directory: bridge

      - name: Build and package macOS ARM64
        run: npm run package:mac -- --arm64
        working-directory: web

      - name: Verify ARM64 artifacts
        run: |
          test -n "$(find release -maxdepth 1 -type f -name '*-mac-arm64.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*-mac-arm64.zip' -print -quit)"
          echo "Supru-AI macOS ARM64 artifacts:"
          find release -maxdepth 1 -type f \( -name '*-mac-arm64.dmg' -o -name '*-mac-arm64.zip' \) -print
        working-directory: web

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supru-AI-macOS-arm64-${{ github.sha }}
          path: |
            web/release/*-mac-arm64.dmg
            web/release/*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 14
