name: Build Supru-AI macOS ARM64

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'web/**'
      - '.github/workflows/desktop-apps.yml'

permissions:
  contents: read

concurrency:
  group: supru-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Supru-AI macOS ARM64
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Prepare OMP runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge/src/bin
          npm pack @oh-my-pi/pi-coding-agent@18.0.8 --pack-destination /tmp/omp-package
          OMP_TGZ="$(find /tmp/omp-package -maxdepth 1 -type f -name '@oh-my-pi-pi-coding-agent-18.0.8.tgz' -print -quit)"
          test -n "$OMP_TGZ"
          rm -rf /tmp/omp-package/extracted
          mkdir -p /tmp/omp-package/extracted
          tar -xzf "$OMP_TGZ" -C /tmp/omp-package/extracted
          PACKAGE="/tmp/omp-package/extracted/package"
          test -f "$PACKAGE/package.json"
          echo "OMP package contents:"
          node -e "const p=require('$PACKAGE/package.json'); console.log(JSON.stringify({name:p.name,version:p.version,bin:p.bin},null,2))"
          if [ -z "$(node -e "const p=require('$PACKAGE/package.json'); const b=p.bin; console.log(typeof b === 'string' ? b : b && Object.values(b).join('\\n') || '')")" ]; then
            echo "OMP package does not expose a CLI binary."
            exit 1
          fi
          cp -R "$PACKAGE" bridge/src/bin/omp-package

      - name: Run desktop tests
        run: npm run test:desktop
        working-directory: web

      - name: Run platform regression tests
        run: npm run test:platform
        working-directory: web

      - name: Run bridge tests
        run: npm test 2>&1 | tee bridge-test.log
        working-directory: bridge

      - name: Print bridge test failures clearly
        if: failure()
        shell: bash
        run: |
          echo '========== BRIDGE TEST FAILURE REPORT =========='
          if [ -f bridge/bridge-test.log ]; then
            grep -E '^(not ok|FAIL|Error:|AssertionError|  (actual|expected):)' bridge/bridge-test.log || true
            tail -n 120 bridge/bridge-test.log
          fi
          echo '========== END BRIDGE TEST FAILURE REPORT =========='

      - name: Build and package macOS ARM64
        run: npm run package:mac -- --arm64
        working-directory: web

      - name: Verify packaged macOS ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.dmg' -print -quit)"
          ZIP="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.zip' -print -quit)"
          test -n "$DMG"
          test -n "$ZIP"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_POINT" -quiet
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle was found inside the generated DMG."
            exit 1
          fi

          BUNDLED_OMP="$APP/Contents/Resources/bridge/src/bin/omp-package"
          test -d "$BUNDLED_OMP"
          test -f "$BUNDLED_OMP/package.json"
          node -e "const p=require(process.argv[1] + '/package.json'); console.log('Bundled OMP:',p.name,p.version,p.bin)" "$BUNDLED_OMP"

          echo "Checking the signature produced by electron-builder..."
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 || true
          spctl --assess --type execute --verbose=4 "$APP" || true

          echo "Verified Supru-AI macOS ARM64 artifacts and bundled OMP package."
          find release -maxdepth 1 -type f \( -name '*-mac-arm64-adhoc.dmg' -o -name '*-mac-arm64-adhoc.zip' \) -print
        working-directory: web

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supru-AI-macOS-arm64-${{ github.sha }}
          path: |
            web/release/*-mac-arm64-adhoc.dmg
            web/release/*-mac-arm64-adhoc.zip
          if-no-files-found: error
          retention-days: 14
