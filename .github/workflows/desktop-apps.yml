name: Build Supru-AI macOS ARM64

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - 'web/**'
      - '.github/workflows/desktop-apps.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - 'web/**'
      - '.github/workflows/desktop-apps.yml'

permissions:
  contents: read

concurrency:
  group: supru-ai-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Supru-AI macOS ARM64
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Align lockfile identity for CI
        shell: bash
        working-directory: web
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.name = 'supru-ai-web';
          lock.version = '2.10.4';
          if (lock.packages && lock.packages['']) {
            lock.packages[''].name = 'supru-ai-web';
            lock.packages[''].version = '2.10.4';
          }
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Setup Bun for OMP compatibility checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install pinned OMP for CI compatibility check
        run: npm install --global @oh-my-pi/pi-coding-agent@18.0.8

      - name: Verify OMP CLI
        run: |
          command -v bun
          command -v omp
          bun --version
          omp --version

      - name: Run desktop tests
        run: npm run test:desktop
        working-directory: web

      - name: Run platform regression tests
        run: npm run test:platform
        working-directory: web

      - name: Run bridge tests
        run: npm test
        working-directory: bridge

      - name: Build desktop renderer
        run: npm run build:desktop-renderer
        working-directory: web

      - name: Verify renderer bundle
        run: npm run verify:desktop-renderer
        working-directory: web

      - name: Build Electron main process
        run: npm run build:electron
        working-directory: web

      - name: Package the verified ARM64 build
        run: npx electron-builder --publish never --mac --arm64
        working-directory: web

      - name: Verify packaged macOS ARM64 app
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find release -maxdepth 1 -type f -name '*-mac-arm64-adhoc.dmg' -print -quit)"
          test -n "$DMG" || { echo 'ERROR: ARM64 DMG was not produced.'; exit 1; }

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true
            rm -rf "$MOUNT_POINT"
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT_POINT" -quiet
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP" || { echo 'ERROR: No .app bundle found inside the ARM64 DMG.'; exit 1; }

          APP_ASAR="$APP/Contents/Resources/app.asar"
          test -f "$APP_ASAR" || { echo "ERROR: Missing app.asar: $APP_ASAR"; exit 1; }

          npx asar list "$APP_ASAR" > packaged-asar-list.txt
          echo 'First packaged ASAR entries:'
          head -n 120 packaged-asar-list.txt

          # Do not assume electron-builder/asar prints a particular leading slash
          # or that the renderer directory is at a hard-coded root path.
          if ! grep -Eq '(^|/)index\.html$' packaged-asar-list.txt; then
            echo 'ERROR: No index.html was found anywhere in app.asar.'
            exit 1
          fi
          if ! grep -Eq '(^|/)assets/.*\.js$|(^|/)assets/.*\.mjs$' packaged-asar-list.txt; then
            echo 'ERROR: No compiled JavaScript renderer asset was found in app.asar.'
            exit 1
          fi
          if grep -Eq '(^|/)dist/.*\.(ts|tsx)$|(^|/).*\.(ts|tsx)$' packaged-asar-list.txt; then
            echo 'ERROR: TypeScript source was packaged into app.asar.'
            exit 1
          fi

          EXECUTABLE="$APP/Contents/MacOS/Supru AI"
          test -f "$EXECUTABLE" || { echo "ERROR: Missing executable: $EXECUTABLE"; exit 1; }
          file "$EXECUTABLE"
          codesign --verify --deep --verbose=4 "$APP"
          echo 'Verified Supru-AI macOS ARM64 package.'

      - name: Upload macOS ARM64 artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Supru-AI-macOS-arm64-${{ github.sha }}
          path: web/release/*-mac-arm64-adhoc.dmg
          if-no-files-found: error
          retention-days: 14
