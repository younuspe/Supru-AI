name: Deploy Supru AI Web to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/public/**'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.*'
      - 'Supru AI WEb.png'
      - 'Supru AI UI.png'
      - '.github/workflows/gh-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: supru-ai-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Supru AI Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm install --ignore-scripts
        working-directory: web

      - name: Prepare Supru UI assets
        run: |
          set -euo pipefail
          mkdir -p web/assets
          cp Supru AI WEb.png Supru AI WEb.png
          cp Supru AI UI.png Supru AI UI.png
          test -s Supru AI WEb.png
          test -s Supru AI UI.png

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Verify Supru UI assets
        run: |
          set -euo pipefail
          test -s web/dist/assets/supru-ai-web.png
          test -s web/dist/assets/supru-ai-ui.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
