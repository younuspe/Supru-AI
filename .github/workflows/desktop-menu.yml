name: Verify Supru-AI desktop menu

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'web/electron/**'
      - 'web/scripts/menu-smoke.mjs'
      - 'web/src/App.tsx'
      - 'web/src/desktopBridge.ts'
      - 'web/package.json'
      - '.github/workflows/desktop-menu.yml'

permissions:
  contents: read

concurrency:
  group: supru-ai-menu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menu:
    name: Supru-AI menu on macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Run desktop unit tests
        run: npm run test:desktop
        working-directory: web

      - name: Verify the application menu
        run: npm run test:desktop:menu
        working-directory: web
