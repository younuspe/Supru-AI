name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install Project Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Application
        run: |
          if npm run build --if-present; then
            echo "Web asset build completed."
          fi

      - name: Sync Android via Capacitor
        run: |
          if npx cap sync android; then
            echo "Capacitor synchronization completed."
          fi

      - name: Compile Release APK (Gradle)
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease
          fi

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supru-ai-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
